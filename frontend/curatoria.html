<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curatoría: expedientes — AlTiro</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/api.js" defer></script>
  <script src="js/dom.js" defer></script>
  <script src="js/expediente.js" defer></script>
  <script src="js/curatoria-comun.js" defer></script>
  <script src="js/curatoria.js" defer></script>
  <script src="js/version.js" defer></script>
  <script src="js/pie.js" defer></script>
  <script src="js/volver.js" defer></script>
</head>
<body class="pagina-amplia">
  <header class="encabezado">
    <a class="marca" href="index.html">AlTiro</a>
    <a class="enlace-encabezado" data-volver href="cuenta.html">← Volver</a>
    <a class="enlace-encabezado" href="cuenta.html">Mi cuenta</a>
  </header>
  <main>
    <h1 id="titulo-pagina" tabindex="-1">Expedientes de maestros</h1>
    <div id="aviso-pagina" class="aviso" role="alert" tabindex="-1"></div>

    <!-- RF-35: avisos de documentos por vencer (GET /api/curatoria/avisos). -->
    <section id="avisos" class="tarjeta avisos" aria-labelledby="titulo-avisos">
      <h2 id="titulo-avisos">Avisos de vencimiento</h2>
      <p id="estado-avisos" role="status">Cargando avisos…</p>
      <ul id="lista-avisos" class="lista-avisos"></ul>
    </section>

    <section id="contenido" aria-labelledby="titulo-pagina">
      <nav aria-labelledby="titulo-filtros">
        <h2 id="titulo-filtros" class="titulo-filtros">Mostrar expedientes</h2>
        <div id="filtros" class="filtros"></div>
      </nav>

      <p id="resultado" class="resultado" role="status" aria-live="polite" tabindex="-1">Cargando expedientes…</p>
      <ul id="lista-expedientes" class="lista-documentos"></ul>

      <nav id="paginacion" class="paginacion" hidden aria-label="Páginas de la cola">
        <button type="button" id="pagina-anterior" class="boton-secundario">Página anterior</button>
        <button type="button" id="pagina-siguiente" class="boton-secundario">Página siguiente</button>
      </nav>
    </section>
  </main>
  <footer class="pie" role="contentinfo">
    <p>AlTiro <span id="pie-version"></span> · © 2026 Equipo AlTiro.</p>
    <p>Prueba de concepto académica; no es un servicio comercial. Los datos de demostración son ficticios.</p>
  </footer>
</body>
</html>
