<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Crear una contraseña nueva — AlTiro</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/api.js" defer></script>
  <script src="js/formulario.js" defer></script>
  <script src="js/nueva-contrasena.js" defer></script>
</head>
<body>
  <header class="encabezado"><a class="marca" href="index.html">AlTiro</a></header>
  <main>
    <h1>Crear una contraseña nueva</h1>
    <div id="sin-enlace" class="aviso aviso-error oculto" role="alert" tabindex="-1">
      Este enlace está incompleto. Ábrelo de nuevo desde el correo o pide uno nuevo.
      <a class="boton" href="recuperar.html">Pedir un enlace nuevo</a>
    </div>
    <form id="nueva-contrasena" class="oculto" novalidate>
      <div class="aviso" role="alert" tabindex="-1"></div>
      <span class="error-campo" id="error-token"></span>
      <div class="campo">
        <label for="contrasena-nueva">Contraseña nueva</label>
        <span class="ayuda" id="ayuda-contrasena-nueva">Al menos 12 caracteres. Puede ser una frase que recuerdes.</span>
        <input id="contrasena-nueva" name="contrasena_nueva" type="password" autocomplete="new-password" required
               aria-describedby="ayuda-contrasena-nueva error-contrasena_nueva">
        <label class="casilla"><input type="checkbox" data-mostrar="contrasena-nueva"> Mostrar contraseña</label>
        <span class="error-campo" id="error-contrasena_nueva"></span>
      </div>
      <div class="acciones">
        <button type="submit">Guardar contraseña</button>
      </div>
    </form>
    <div id="listo" class="oculto">
      <div class="aviso aviso-exito" role="status" tabindex="-1" id="aviso-listo"></div>
      <div class="acciones">
        <a class="boton" href="ingresar.html">Ingresar</a>
      </div>
    </div>
  </main>
</body>
</html>
