<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis documentos — AlTiro</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/api.js" defer></script>
  <script src="js/expediente.js" defer></script>
  <script src="js/visor.js" defer></script>
  <script src="js/mis-documentos.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="index.html">AlTiro</a>
    <a class="enlace-encabezado" href="cuenta.html">Mi cuenta</a>
  </header>
  <main>
    <h1 id="titulo-pagina" tabindex="-1">Mis documentos</h1>
    <p id="cargando" role="status">Cargando tus documentos…</p>
    <div id="aviso-pagina" class="aviso" role="alert" tabindex="-1"></div>

    <section id="contenido" class="oculto" aria-labelledby="titulo-pagina">
      <p class="linea-estado">Tu postulación: <span id="estado-expediente"></span></p>
      <!-- RF-35: avisos de documentos por vencer (texto del servidor). -->
      <section id="avisos" class="tarjeta avisos oculto" aria-labelledby="titulo-avisos">
        <h2 id="titulo-avisos">Avisos</h2>
        <ul id="lista-avisos" class="lista-avisos"></ul>
      </section>
      <p id="sin-documentos" class="oculto">Todavía no has enviado documentos.</p>
      <ul id="lista-documentos" class="lista-documentos"></ul>
      <div id="bloque-faltan" class="tarjeta oculto">
        <h2>Te falta entregar</h2>
        <ul id="lista-faltan"></ul>
      </div>
      <div class="acciones">
        <a class="boton" href="mi-postulacion.html">Ir a mi postulación</a>
      </div>
    </section>

    <!-- Visor de la foto: enlace temporal de 10 minutos (RNF-06). -->
    <dialog id="visor" class="visor" aria-labelledby="titulo-visor">
      <h2 id="titulo-visor"></h2>
      <p id="estado-visor" role="status"></p>
      <img id="imagen-visor" alt="" hidden>
      <div class="acciones">
        <button type="button" class="boton-secundario oculto" id="visor-otra-cara"></button>
        <button type="button" id="visor-cerrar">Cerrar</button>
      </div>
    </dialog>
  </main>
</body>
</html>
