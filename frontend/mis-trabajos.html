<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis trabajos — AlTiro</title>
  <link rel="stylesheet" href="css/base.css">
  <script src="js/api.js" defer></script>
  <script src="js/formulario.js" defer></script>
  <script src="js/formato.js" defer></script>
  <script src="js/estado-pedido.js" defer></script>
  <script src="js/mis-trabajos.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="index.html">AlTiro</a>
    <a class="enlace-encabezado" href="cuenta.html">Mi cuenta</a>
  </header>
  <main>
    <h1 id="titulo-pagina" tabindex="-1">Mis trabajos</h1>
    <p id="cargando" role="status">Cargando tus trabajos…</p>
    <div id="aviso-pagina" class="aviso" role="alert" tabindex="-1"></div>
    <div id="aviso-resultado" class="aviso" role="status" aria-live="polite" tabindex="-1"></div>

    <div id="contenido" hidden>
      <!-- Avisos de mis trabajos (ADR-024): sin consultas periódicas, botón «Actualizar». -->
      <section class="tarjeta avisos" aria-labelledby="titulo-avisos">
        <h2 id="titulo-avisos">Avisos <span id="contador-avisos" class="cuenta-pendiente"></span></h2>
        <ul id="lista-avisos" class="lista-avisos"></ul>
        <p id="sin-avisos" hidden>No tienes avisos.</p>
        <div class="acciones">
          <button type="button" id="actualizar-avisos" class="boton-secundario">Actualizar avisos</button>
        </div>
      </section>

      <!-- Pestañas por estado (CA-15.1, CA-08.2). -->
      <div class="filtros" role="group" aria-label="Filtrar por estado" id="pestanas">
        <button type="button" class="filtro" data-tab="pendiente" aria-pressed="true">Nuevos</button>
        <button type="button" class="filtro" data-tab="aceptado" aria-pressed="false">Aceptados</button>
        <button type="button" class="filtro" data-tab="cerrado" aria-pressed="false">Cerrados</button>
      </div>

      <section id="tab-pendiente" aria-labelledby="titulo-pendiente">
        <h2 id="titulo-pendiente">Nuevos</h2>
        <p id="sin-pendiente" hidden>No tienes pedidos nuevos.</p>
        <ul id="lista-pendiente" class="lista-simple lista-pedidos"></ul>
        <div class="acciones" id="paginacion-pendiente" hidden>
          <button type="button" class="boton-secundario" data-anterior>Página anterior</button>
          <span id="texto-pagina-pendiente"></span>
          <button type="button" class="boton-secundario" data-siguiente>Página siguiente</button>
        </div>
      </section>

      <section id="tab-aceptado" class="oculto" aria-labelledby="titulo-aceptado">
        <h2 id="titulo-aceptado">Aceptados</h2>
        <p id="sin-aceptado" hidden>No tienes trabajos aceptados.</p>
        <ul id="lista-aceptado" class="lista-simple lista-pedidos"></ul>
        <div class="acciones" id="paginacion-aceptado" hidden>
          <button type="button" class="boton-secundario" data-anterior>Página anterior</button>
          <span id="texto-pagina-aceptado"></span>
          <button type="button" class="boton-secundario" data-siguiente>Página siguiente</button>
        </div>
      </section>

      <section id="tab-cerrado" class="oculto" aria-labelledby="titulo-cerrado">
        <h2 id="titulo-cerrado">Cerrados</h2>
        <p id="sin-cerrado" hidden>No tienes pedidos cerrados.</p>
        <ul id="lista-cerrado" class="lista-simple lista-pedidos"></ul>
        <div class="acciones" id="paginacion-cerrado" hidden>
          <button type="button" class="boton-secundario" data-anterior>Página anterior</button>
          <span id="texto-pagina-cerrado"></span>
          <button type="button" class="boton-secundario" data-siguiente>Página siguiente</button>
        </div>
      </section>
    </div>

    <!-- Detalle de un pedido: se mueve dentro de la tarjeta que se abre. -->
    <section id="detalle-pedido" class="tarjeta" hidden aria-labelledby="titulo-detalle">
      <h3 id="titulo-detalle" tabindex="-1"></h3>
      <div id="aviso-detalle" class="aviso" role="alert" tabindex="-1"></div>
      <dl class="datos" id="datos-detalle"></dl>
      <div class="acciones">
        <button type="button" id="aceptar-pedido" hidden>Aceptar este pedido</button>
        <button type="button" id="rechazar-pedido" class="boton-peligro" hidden>Rechazar este pedido</button>
        <button type="button" class="boton-secundario" id="cerrar-detalle">Cerrar</button>
      </div>
    </section>

    <!-- Confirmación de aceptar o rechazar (sin ventanas del navegador). -->
    <div id="confirmar-accion" class="confirmacion" hidden>
      <h3 id="titulo-confirmar-accion" tabindex="-1"></h3>
      <p id="texto-confirmar-accion"></p>
      <div id="aviso-accion" class="aviso" role="alert" tabindex="-1"></div>
      <div class="acciones">
        <button type="button" id="accion-si">Sí</button>
        <button type="button" id="accion-no" class="boton-secundario">No, volver</button>
      </div>
    </div>
  </main>
</body>
</html>
