# AlTiro — prueba de concepto local.
# Comando único (RNF-23, ADR-009): docker compose up -d --build
# No depende de que exista .env: cada variable tiene un valor por defecto aquí.
# Solo el servicio "proxy" publica puertos (ADR-003, ADR-008).

name: altiro

services:
  # Ejecución única e idempotente: genera secretos y el certificado autofirmado
  # si no existen (ADR-008, ADR-009). No tiene red.
  init:
    build: ./infra/init
    image: altiro-init:local
    environment:
      ALTIRO_TLS_SAN: ${ALTIRO_TLS_SAN:-DNS:localhost,IP:127.0.0.1}
    volumes:
      - secretos:/secretos
      - certificados:/certificados
    network_mode: none
    restart: "no"

  db:
    image: postgres:16.15-bookworm
    # ADR-003, Enmienda E-1 (DEF-QA-004): el log del servidor no escribe la
    # sentencia (STATEMENT) ni DETAIL/HINT/CONTEXT/QUERY de los errores, que
    # pueden llevar datos personales. Siguen registrándose los ERROR con el
    # nombre de la restricción. "error"/"default" solo para diagnóstico local.
    command:
      - postgres
      - -c
      - log_min_error_statement=${ALTIRO_DB_LOG_MIN_ERROR_STATEMENT:-panic}
      - -c
      - log_error_verbosity=${ALTIRO_DB_LOG_ERROR_VERBOSITY:-terse}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-altiro}
      # Rol administrativo (superusuario de la imagen): solo inicializa la base.
      POSTGRES_USER: ${POSTGRES_USER:-altiro_admin}
      POSTGRES_PASSWORD_FILE: /secretos/db_admin_password
      # Rol de la aplicación, sin superusuario; lo crea infra/db/initdb.
      ALTIRO_DB_APP_USER: ${ALTIRO_DB_APP_USER:-altiro_app}
      ALTIRO_DB_APP_PASSWORD_FILE: /secretos/db_app_password
    volumes:
      - datos_db:/var/lib/postgresql/data
      - secretos:/secretos:ro
      - ./infra/db/initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - interna
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha en
      # el socket local, así que la base no se declara sana antes de crear el rol.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build: ./backend
    image: altiro-app:local
    environment:
      DJANGO_SECRET_KEY_FILE: /secretos/django_secret_key
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
      DJANGO_CONFIAR_PROXY_TLS: "true"
      # La app solo es accesible desde el proxy (red interna): confía en X-Real-IP (ADR-007).
      ALTIRO_CONFIAR_X_REAL_IP: "true"
      ALTIRO_SESION_INACTIVIDAD_SEGUNDOS: ${ALTIRO_SESION_INACTIVIDAD_SEGUNDOS:-1800}
      # La app se conecta con su propio rol, nunca con POSTGRES_USER.
      ALTIRO_DB_HOST: db
      ALTIRO_DB_PORT: "5432"
      ALTIRO_DB_NAME: ${POSTGRES_DB:-altiro}
      ALTIRO_DB_USER: ${ALTIRO_DB_APP_USER:-altiro_app}
      ALTIRO_DB_PASSWORD_FILE: /secretos/db_app_password
      # Documentos del maestro (ADR-015): clave de cifrado generada por "init"
      # y directorio del volumen "documentos".
      ALTIRO_DOCUMENTOS_CLAVE_FILE: /secretos/documentos_clave
      ALTIRO_DOCUMENTOS_DIR: /documentos
      # Foto del maestro (ADR-021): volumen "fotos", solo en app.
      ALTIRO_FOTOS_DIR: /fotos
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - secretos:/secretos:ro
      # Solo en app y en el planificador; nunca en
      # proxy (ADR-015, D-3). El dueño 10001 y el modo 0700 los toma de
      # /documentos de la imagen al crearse el volumen (backend/Dockerfile).
      - documentos:/documentos
      # Foto del maestro (ADR-021, punto 3): solo en app; nunca en el proxy ni
      # en el planificador. Dueño 10001 y modo 0700 desde /fotos de la imagen.
      - fotos:/fotos
    networks:
      - interna
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # Actor Sistema (ADR-016): cada hora corre tareas idempotentes (avisos de
  # RF-35, purga de acceso_denegado y archivos huérfanos). Misma imagen que app,
  # sin puertos, solo en la red interna. No aplica migraciones: espera a que app
  # (que las aplica al arrancar) esté sana.
  planificador:
    image: altiro-app:local
    entrypoint: ["python", "manage.py", "planificador"]
    environment:
      DJANGO_SECRET_KEY_FILE: /secretos/django_secret_key
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost,https://127.0.0.1}
      ALTIRO_DB_HOST: db
      ALTIRO_DB_PORT: "5432"
      ALTIRO_DB_NAME: ${POSTGRES_DB:-altiro}
      ALTIRO_DB_USER: ${ALTIRO_DB_APP_USER:-altiro_app}
      ALTIRO_DB_PASSWORD_FILE: /secretos/db_app_password
      # Settings exige la clave al cargar (ADR-015); el planificador no descifra archivos.
      ALTIRO_DOCUMENTOS_CLAVE_FILE: /secretos/documentos_clave
      ALTIRO_DOCUMENTOS_DIR: /documentos
      # Settings exige la variable; el planificador no usa las fotos y el
      # volumen "fotos" no se monta aquí (ADR-021, punto 3): /fotos es el
      # directorio vacío de la imagen.
      ALTIRO_FOTOS_DIR: /fotos
      ALTIRO_PLANIFICADOR_INTERVALO_SEGUNDOS: ${ALTIRO_PLANIFICADOR_INTERVALO_SEGUNDOS:-3600}
    volumes:
      - secretos:/secretos:ro
      # Para la limpieza de archivos huérfanos (ADR-015, D-3: app y planificador).
      - documentos:/documentos
    networks:
      - interna
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      # El bucle renueva el latido al menos cada 60 s (expediente/management/commands/planificador.py).
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/altiro-planificador.latido') < 180 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: nginx:1.30.5-alpine
    environment:
      ALTIRO_HTTPS_PORT: ${ALTIRO_HTTPS_PORT:-443}
    ports:
      # 127.0.0.1 por defecto; exponer a la red local solo con ALTIRO_BIND_ADDR (ADR-008).
      - "${ALTIRO_BIND_ADDR:-127.0.0.1}:${ALTIRO_HTTP_PORT:-80}:80"
      - "${ALTIRO_BIND_ADDR:-127.0.0.1}:${ALTIRO_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/proxy/templates:/etc/nginx/templates:ro
      - ./frontend:/usr/share/nginx/html:ro
      - certificados:/etc/nginx/certificados:ro
    networks:
      - frontal
      - interna
    depends_on:
      init:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsk -o /dev/null https://127.0.0.1/ || wget -q -O /dev/null --no-check-certificate https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

networks:
  # Red con salida, usada solo por el proxy para publicar puertos.
  frontal: {}
  # Red sin salida al exterior: proxy <-> app <-> db.
  interna:
    internal: true

volumes:
  datos_db: {}
  secretos: {}
  certificados: {}
  # Documentos del maestro, cifrados (ADR-015). Se respaldan por separado de
  # la clave secretos/documentos_clave (RNF-19).
  documentos: {}
  # Foto del maestro, sin cifrar (ADR-021). Se entrega solo si el maestro está
  # publicado. Nombres UUID; sin datos en el nombre.
  fotos: {}
