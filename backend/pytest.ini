[pytest]
DJANGO_SETTINGS_MODULE = altiro.settings
testpaths = tests
# -p no:cacheprovider: el código del contenedor es de solo lectura para el usuario de la app.
# --reuse-db: el rol de la app no puede conectarse a la base "postgres"
# (infra/db/initdb), así que Django no puede borrar la base de pruebas al terminar
# (tendría que hacerlo desde la misma base abierta). Se conserva y se reutiliza;
# para recrearla: pytest --create-db.
addopts = -p no:cacheprovider --reuse-db
# Por la misma razón, Django avisa que crea la base de pruebas desde la base de
# AlTiro en vez de "postgres": es esperado.
filterwarnings =
    ignore:Normally Django will use a connection to the 'postgres' database:RuntimeWarning
